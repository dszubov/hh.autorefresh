name: Refresh Resume

on:
  workflow_dispatch:
    inputs:
      authorization_code:
        description: "One-time HH authorization code for bootstrap or recovery"
        required: false
        type: string
  schedule:
    - cron: "56 */4 * * *"

concurrency:
  group: hh-autorefresh
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install --upgrade pip requests pynacl

      - name: Refresh token if needed and publish resume
        env:
          GITHUB_REPOSITORY: ${{ github.repository }}
          GH_SECRETS_WRITER_PAT: ${{ secrets.GH_SECRETS_WRITER_PAT }}
          HH_CLIENT_ID: ${{ secrets.HH_CLIENT_ID }}
          HH_CLIENT_SECRET: ${{ secrets.HH_CLIENT_SECRET }}
          HH_RESUME_ID: ${{ secrets.HH_RESUME_ID }}
          HH_ACCESS_TOKEN: ${{ secrets.HH_ACCESS_TOKEN }}
          HH_REFRESH_TOKEN: ${{ secrets.HH_REFRESH_TOKEN }}
          HH_TOKEN_EXPIRES_AT: ${{ secrets.HH_TOKEN_EXPIRES_AT }}
          HH_AUTHORIZATION_CODE: ${{ inputs.authorization_code }}
          HH_REDIRECT_URI: http://localhost:8080
        run: python hh.py
